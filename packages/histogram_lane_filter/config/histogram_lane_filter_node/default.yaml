# default parameters for histogram_lane_filter/histogram_lane_filter_node (ROS 2)
#
# Every value below is a live parameter of the node: change it with `ros2 param set` or with the
# `ParamPanel` in the notebook. Changing a filter parameter rebuilds the histogram grid and resets
# the belief to the prior.
#
# The robot's wheel radius, wheel baseline and encoder resolution are NOT listed here: the node reads
# them from the robot calibration (`lx_ros2_tools.robot.get_wheel_params`) and exposes them as the
# parameters `wheel_radius`, `wheel_baseline` and `encoder_resolution`.
/**:
  ros__parameters:
    debug: true
    predict_frequency: 30.0   # in Hz
    # ADD PARAMETERS HERE
    mean_d_0: 0.0
    mean_phi_0: 0.0
    sigma_d_0: 0.1
    sigma_phi_0: 0.1
    delta_d: 0.02
    delta_phi: 0.1
    d_max: 0.3
    d_min: -0.3
    phi_min: -1.5
    phi_max: 1.5
    linewidth_white: 0.05
    linewidth_yellow: 0.025
    lanewidth: 0.23
    sigma_d_mask: 1.0
    sigma_phi_mask: 2.0
    range_min: 0.2
    range_est: 0.45
    range_max: 0.6
